name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --ci --maxWorkers=2

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  native-tests:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The host suites compile only cpp/ops/*.cpp against the machine's
      # OpenCV, so neither Node nor the JS dependencies are needed here.
      - name: Install OpenCV, GoogleTest and clang-format
        run: brew install opencv googletest clang-format

      - name: Check C++ formatting
        run: |
          clang-format --dry-run --Werror \
            $(git ls-files 'cpp/*.h' 'cpp/*.cpp' 'cpp/**/*.h' 'cpp/**/*.cpp' 'ios/*.h' 'ios/*.mm' 'android/*.cpp')

      - name: Build and run the C++ tests
        run: scripts/run-native-tests.sh
