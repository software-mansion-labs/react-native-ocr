name: Docs

# Builds the typedoc API reference and publishes it to GitHub Pages, as
# react-native-rag does. Pages has to be enabled on the repository with
# "GitHub Actions" as its source before the first run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'software-mansion-labs/react-native-ocr'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build docs
        run: yarn docs

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          name: github-pages-${{ github.run_id }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}
